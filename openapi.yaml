openapi: 3.0.3
info:
title: API de Biblioteca
version: 1.0.0
description: API para consultar un catálogo de libros

paths:
  /api/libros:
    get:
      summary: Obtener todos los libros
    responses:
      '200':
        description: Lista de libros obtenida correctamente
  /api/libros/{id}:
    get:
      summary: Obtener el libro filtrado por su id
    responses:
      '200':
        description: Libro obtenido correctamente.
      '404':
        description: Libro no encontrado.
    content:
      application/json:
        schema:
          type: array
        items:
          type: object
        properties:
          id:
          type: integer
          titulo:
          type: string
          autor:
          type: string
  

